# Merge this DNS section and the TUN DNS interception settings into the profile.
# Keep the core in rule mode; 上网模式 selects DIRECT, PASS, or PROXY.
dns:
  enable: true
  enhanced-mode: fake-ip
  ipv6: false
  prefer-h3: false
  respect-rules: true
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
tun:
  dns-hijack:
    - any:53
    - tcp://any:53
